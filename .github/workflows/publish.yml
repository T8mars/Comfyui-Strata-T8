name: Release and Comfy Registry
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: node-publish
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build audited node archive
        run: python tools/build_release.py
      - name: Publish GitHub release
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" dist/*.zip dist/*.sha256 --target "$GITHUB_SHA" --title "Strata-T8 ComfyUI $version" --notes-file RELEASE-NOTES.md --latest
          fi
      - name: Publish using official Comfy action
        uses: Comfy-Org/publish-node-action@0eb6cd742945443bee7f79eeddd4f732780029a1
        with:
          skip_checkout: 'true'
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
