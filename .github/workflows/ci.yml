name: Node checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      STRATA_SOURCE_DIR: ${{ github.workspace }}/_strata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: T8mars/Strata-T8
          ref: 3a0f7c548d9e727ecc8b0b48376959ca1ef07ea9 # Upstream v0.1.40.2, exact 0.1.40.2 engines
          path: _strata
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt numpy jinja2 regex psutil pillow pyyaml
      - run: python -m unittest discover -s tests -q
      - run: python tools/build_release.py
