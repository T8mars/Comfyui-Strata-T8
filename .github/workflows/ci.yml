name: Node checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      STRATA_SOURCE_DIR: ${{ github.workspace }}/_strata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: T8mars/Strata-T8
          ref: 89cd61615a6e174818ea41d4380773ea1e8872f3 # Strata-T8 0.1.44-t8.1, upstream 0.1.44.1 and protocol 1
          path: _strata
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt numpy jinja2 regex psutil pillow pyyaml av==15.0.0
      - run: python -m unittest discover -s tests -q
      - run: python tools/build_release.py
